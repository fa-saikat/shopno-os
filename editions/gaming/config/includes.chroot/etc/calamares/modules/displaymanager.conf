---
displaymanagers:
   - lightdm
   - sddm

# Installed systems log in to shopno-shell's home screen; the live session
# stays on Xfce (LightDM's default, x-session-manager). Without this, Calamares
# picks the first desktop it finds (Xfce) and writes it to the target's
# lightdm.conf as user-session.
defaultDesktopEnvironment:
    executable: "shopno-session"
    desktopFile: "shopno"

basicSetup: false

sysconfigSetup: false

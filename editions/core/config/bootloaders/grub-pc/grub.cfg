source /boot/grub/config.cfg

# Core edition menu (overrides base/config/bootloaders/grub-pc/grub.cfg).
# The live session cannot install (no Calamares): installing is the separate
# debian-installer entry below. No "Safe Graphics" entry - there is no
# graphical session to rescue. Keep the live entry first: it is the default,
# and the boot gate (tests/smoke/test-iso-boots.sh) boots the default entry.

menuentry "Try ShopnoOS (live session)" {
	linux @KERNEL_LIVE@ @APPEND_LIVE@
	initrd @INITRD_LIVE@
}

# Installer (if any)
if @ENABLE_INSTALL_MENU@; then
source	/boot/grub/install_start.cfg
	submenu 'Advanced install options ...' --hotkey=a {
		source /boot/grub/theme.cfg
		source	/boot/grub/install.cfg
	}
fi

submenu 'Utilities...' --hotkey=u {
	source /boot/grub/theme.cfg

	# Memtest (if any)
	if [ "${grub_platform}" = "pc" ] -a @ENABLE_MEMTEST@; then
		source /boot/grub/memtest.cfg
	fi

	# Firmware setup (UEFI)
	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI Firmware Settings" {
			fwsetup
		}
	fi
}

name: Mirror to JaduPC

# fa-saikat/shopno-os is the development repo (issues, PRs, CI/CD).
# JaduPC/shopno-os is the public face: website, Pages, downloads.
# This pushes `main`, `dev` and `v*` release tags there verbatim after
# every push here. Releases themselves (with downloads) are created on
# JaduPC/shopno-os by hand, see docs/release-process.md §8.4.
#
# Auth: MIRROR_DEPLOY_KEY is the private half of an ed25519 deploy key
# that has write access on JaduPC/shopno-os (and nothing else). It is a
# secret of the `mirror` environment, which only main, dev and v* tags
# may deploy to, so a workflow pushed on any other ref can't read it.
#
# The mirror is one-way and force-pushed, so never commit to main/dev on
# JaduPC/shopno-os directly. Website content there belongs on a branch
# this workflow doesn't touch (e.g. gh-pages).
on:
  push:
    branches: [main, dev]
    tags: ['v*']
  # Manual run: re-sync main, dev and every v* tag.
  workflow_dispatch:

concurrency:
  group: mirror-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    # This file is mirrored too; don't run it on the mirror itself.
    if: github.repository == 'fa-saikat/shopno-os'
    environment: mirror
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to JaduPC/shopno-os
        env:
          MIRROR_DEPLOY_KEY: ${{ secrets.MIRROR_DEPLOY_KEY }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/mirror_key"
          install -m 600 /dev/null "$key"
          printf '%s\n' "$MIRROR_DEPLOY_KEY" > "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          refspecs=()
          if [ "$EVENT" = push ]; then
            case "$REF" in
              refs/heads/*) refspecs+=("refs/remotes/origin/${REF#refs/heads/}:$REF") ;;
              refs/tags/*)  refspecs+=("$REF:$REF") ;;
              *) echo "unexpected ref: $REF" >&2; exit 1 ;;
            esac
          else
            for b in main dev; do
              refspecs+=("refs/remotes/origin/$b:refs/heads/$b")
            done
            while read -r t; do
              refspecs+=("refs/tags/$t:refs/tags/$t")
            done < <(git tag -l 'v*')
          fi

          git push --force git@github.com:JaduPC/shopno-os.git "${refspecs[@]}"
          rm -f "$key"

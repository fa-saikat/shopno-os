name: Build Container

# ADR-008: separate workflow file (never folded into build-iso.yml).
# Disjoint triggers (push:[dev] exists here precisely because build-iso
# deliberately lacks it), disjoint artifact lifecycles (registry-immutable
# tags vs 7-day ISO retention), disjoint timeout tuning. Prove on PR
# (build + smoke, no registry writes); push to GHCR on merge to dev.
#
# Trust layout (Phase 4 remediation A3+A4+A5+A7, A2):
# - `build` proves: tarball, smoke, SBOM (blocking), scan (metric). It
#   holds no write/OIDC rights, so a PR can never leak an image even on
#   misconfiguration (W4). Its handoff upload is BLOCKING - publish
#   depends on it.
# - `publish` (push-only) pushes, signs, attests, then VERIFIES. Push
#   happens only after SBOM/scan succeed (W1); the digest comes from the
#   push itself, never re-read from mutable :edge (W5); cosign + attestation
#   verification must fail red (W6).
on:
  pull_request:
    branches: [dev]
    paths:
      - 'scripts/build/build-container.sh'
      - 'scripts/build/container-exclude.txt'
      - '.github/workflows/container-build.yml'
      - 'base/package-lists/**'
      - 'editions/core/package-lists/**'
      - 'profiles/shopno-os-core/**'
      - 'base/config/archives/**'
      - 'scripts/lib/**'
      - 'brand/**'
  push:
    branches: [dev]
    paths:
      - 'scripts/build/build-container.sh'
      - 'scripts/build/container-exclude.txt'
      - '.github/workflows/container-build.yml'
      - 'base/package-lists/**'
      - 'editions/core/package-lists/**'
      - 'profiles/shopno-os-core/**'
      - 'base/config/archives/**'
      - 'scripts/lib/**'
      - 'brand/**'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Core-family profile to build (v1: core only)'
        required: false
        default: 'shopno-os-core'

# A2 (W2): only PR synchronizes cancel. A newer push must never cancel an
# older run between its push and sign steps - that window stranded unsigned
# images. Stale PR builds are still not worth paying for.
concurrency:
  group: container-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# A3 (W4): least privilege at the top level. The build job (which runs sudo
# on repo code) can never mint an OIDC identity or push an image - write
# rights live only on the push-gated publish job below.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build + smoke + SBOM (shopno-os-core)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # A9 (W10): the dispatch input is honored, never dead. PR/push events
    # carry no inputs (null) so the default keeps them on core; the script's
    # core-only guard still rejects anything outside v1 scope.
    env:
      PROFILE: ${{ github.event.inputs.profile || 'shopno-os-core' }}
    # Rootfs builds take minutes, not the ISO's hour - generous ceiling
    # with room; shrink only on measured evidence, never preemptively.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # build-container.sh needs: mmdebstrap, buildah, jq, gpg.
      # Smoke path uses skopeo (tarball -> docker daemon bridge) + the
      # runner's preinstalled docker. buildah bud/run is deliberately NOT
      # the smoke runtime: rootless OCI runtimes (crun/newuidmap) are not
      # guaranteed on hosted runners, while the docker daemon always is.
      # Boring reliability over cleverness.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mmdebstrap buildah jq skopeo
          # build-container.sh requires /usr/share/keyrings/
          # debian-archive-keyring.gpg on the HOST (explicit signed-by for
          # the Debian sources it assembles). Noble's 2023.4 keyring predates
          # the trixie keys - same pinned-.deb treatment as build-iso.yml.
          KEYRING_DEB=/tmp/debian-archive-keyring.deb
          curl -sL --max-time 120 -o "${KEYRING_DEB}" \
            http://deb.debian.org/debian/pool/main/d/debian-archive-keyring/debian-archive-keyring_2025.1_all.deb
          echo "9ea7778e443144ca490668737a8ab22dd3e748bb99e805e22ec055abeb3c7fac  ${KEYRING_DEB}" | sha256sum -c -
          sudo dpkg -i "${KEYRING_DEB}"

      # Root (same as build.sh): hosted runners disable unprivileged user
      # namespaces, so mmdebstrap cannot run rootless here - it needs real
      # privilege, not the userns fallback. Artifacts land root-owned;
      # clean.sh already gates that case (refuses non-root, verified
      # removal under sudo).
      - name: Build OCI tarball (no push)
        run: sudo ./scripts/build/build-container.sh --profile "${PROFILE}"

      - name: Locate tarball + manifest
        id: artifact
        run: |
          TARBALL="$(find build/container -maxdepth 1 -name '*.oci.tar' | sort | head -1)"
          test -n "${TARBALL}" || { echo "No OCI tarball produced"; exit 1; }
          echo "tarball=${TARBALL}" >> "${GITHUB_OUTPUT}"
          ls -la build/container/
          # The build ran under sudo, so this dir is root-owned while every
          # downstream step (SBOM, scan, upload) runs unprivileged. Hand it
          # back once, here, instead of sudo-ing each consumer.
          sudo chown -R "$(id -u):$(id -g)" build/container

      # Smoke: the image must refresh its own package indexes (Debian +
      # baked-in ShopnoOS repo alike), then install and run a package
      # guaranteed absent from minbase - proving installs work inside the
      # artifact, not just at build time. `hello` is that package (tiny,
      # dependency-free, in trixie/main); `curl` is not - it already ships
      # in the image, so installing it proved nothing. Runs on PRs too:
      # minutes of compute for pre-merge signal is obviously worth it.
      - name: Smoke test - load and exercise image
        run: |
          TAG="smoke-test:${GITHUB_SHA::8}"
          skopeo copy "oci-archive:${{ steps.artifact.outputs.tarball }}" "docker-daemon:${TAG}"
          docker run --rm "${TAG}" bash -c 'cat /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null'
          docker run --rm "${TAG}" bash -c 'apt-get update && apt-get install -y --no-install-recommends hello && hello'
          docker rmi "${TAG}" || true

      # Anchore tools aren't in noble's repos - pinned GitHub-release
      # binaries with checksum verification (same pinning discipline as
      # the live-build/keyring .debs above; re-pin deliberately).
      - name: Install SBOM and scan tools
        run: |
          SYFT_VER=1.52.0
          SYFT_TGZ="syft_${SYFT_VER}_linux_amd64.tar.gz"
          curl -sL --max-time 120 -o "/tmp/${SYFT_TGZ}" "https://github.com/anchore/syft/releases/download/v${SYFT_VER}/${SYFT_TGZ}"
          curl -sL --max-time 120 -o /tmp/syft-checksums.txt "https://github.com/anchore/syft/releases/download/v${SYFT_VER}/syft_${SYFT_VER}_checksums.txt"
          (cd /tmp && grep "${SYFT_TGZ}" syft-checksums.txt | sha256sum -c -)
          sudo tar -xzf "/tmp/${SYFT_TGZ}" -C /usr/local/bin syft
          GRYPE_VER=0.119.0
          GRYPE_TGZ="grype_${GRYPE_VER}_linux_amd64.tar.gz"
          curl -sL --max-time 120 -o "/tmp/${GRYPE_TGZ}" "https://github.com/anchore/grype/releases/download/v${GRYPE_VER}/${GRYPE_TGZ}"
          curl -sL --max-time 120 -o /tmp/grype-checksums.txt "https://github.com/anchore/grype/releases/download/v${GRYPE_VER}/grype_${GRYPE_VER}_checksums.txt"
          (cd /tmp && grep "${GRYPE_TGZ}" grype-checksums.txt | sha256sum -c -)
          sudo tar -xzf "/tmp/${GRYPE_TGZ}" -C /usr/local/bin grype
          syft version && grype version

      # Blocking: no SBOM means the scan has no input and provenance has
      # nothing to describe - a missing SBOM is a build defect, not a metric.
      # A4 (W1): this runs BEFORE any registry write, in this job. A failure
      # here leaves nothing in GHCR by construction.
      - name: Generate SBOM
        run: |
          syft scan "oci-archive:${{ steps.artifact.outputs.tarball }}" -o spdx-json=build/container/sbom.spdx.json
          SBOM_COUNT="$(jq '.packages | length' build/container/sbom.spdx.json)"
          echo "SBOM packages: ${SBOM_COUNT}"
          echo "- SBOM packages: **${SBOM_COUNT}**" >> "${GITHUB_STEP_SUMMARY}"

      # Metric-first (ADR-005): base images always carry CVEs, so a blocking
      # scan on day one would veto good builds for upstream noise. The table
      # prints for humans; the SARIF uploads for tooling; promotion to a
      # gate waits on a trusted baseline like everything else here.
      # NOTE: `|| true` on the table form only - a findings-exit must not
      # skip the SARIF write in the next line.
      - name: Vulnerability scan (non-blocking metric)
        id: scan
        continue-on-error: true
        run: |
          grype "sbom:build/container/sbom.spdx.json" -o table || true
          grype "sbom:build/container/sbom.spdx.json" -o "sarif=build/container/grype.sarif"
          FINDINGS="$(jq '[.runs[].results // empty | .[]] | length' build/container/grype.sarif)"
          echo "Grype findings: ${FINDINGS} (metric only - see SARIF artifact)"
          echo "- Grype findings: **${FINDINGS}** (metric, non-blocking)" >> "${GITHUB_STEP_SUMMARY}"

      # Handoff to the publish job (A3/A4). BLOCKING by design: publish
      # `needs: build`, so a failed upload here stops the pipeline before
      # any registry write. Push-only: publish is the sole consumer, so PR
      # runs skip this entirely - zero quota burn for bytes nobody
      # downloads (quota is a recurring cost). 1-day retention - the publish
      # job consumes this within minutes.
      - name: Upload build handoff (tarball + manifest + SBOM)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: container-build-handoff
          retention-days: 1
          path: |
            build/container/*.oci.tar
            build/container/container-manifest.json
            build/container/sbom.spdx.json

      # Preservation must never veto verdicts: upload fails only on
      # environmental causes (quota, network, service health) - never on
      # anything about the code. Evidence already lives in step logs and
      # the summary above; artifacts are convenience, not proof.
      - name: Upload SBOM and scan report
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: container-sbom-scan
          retention-days: 7
          path: |
            build/container/sbom.spdx.json
            build/container/grype.sarif

  # --- Publish: merge-to-dev only (prove on PR, push on merge) ---
  # Runs only after the build job proved the image. Holds the only
  # write/OIDC rights in this workflow. Never runs repo code (no checkout,
  # no build scripts) - it moves bytes, signs digests, and verifies.
  publish:
    name: Push + sign + attest + verify
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    timeout-minutes: 20
    steps:
      # A9 (W11): image path derived from the repo, never hardcoded - a
      # rename/move keeps working, and the no-hardcode lint rule holds.
      - name: Resolve image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "${GITHUB_ENV}"

      - name: Download build handoff
        uses: actions/download-artifact@v4
        with:
          name: container-build-handoff
          path: handoff

      # Depth-agnostic lookup: upload-artifact preserves directory structure
      # under the artifact root, so don't assume a flat layout here.
      - name: Locate tarball + SBOM
        id: artifact
        run: |
          TARBALL="$(find handoff -name '*.oci.tar' | sort | head -1)"
          test -n "${TARBALL}" || { echo "No OCI tarball in handoff"; exit 1; }
          MANIFEST="$(find handoff -name 'container-manifest.json' | sort | head -1)"
          test -n "${MANIFEST}" || { echo "No manifest in handoff"; exit 1; }
          SBOM="$(find handoff -name 'sbom.spdx.json' | sort | head -1)"
          test -n "${SBOM}" || { echo "No SBOM in handoff"; exit 1; }
          echo "tarball=${TARBALL}" >> "${GITHUB_OUTPUT}"
          echo "sbom=${SBOM}" >> "${GITHUB_OUTPUT}"
          find handoff -type f | sort

      # Publish needs only skopeo + jq (+ cosign below). No mmdebstrap,
      # no keyring .deb - nothing here assembles APT sources.
      - name: Install publish tools (skopeo, jq, cosign pinned)
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo jq
          # No publisher checksums.txt for cosign releases - trust-on-first-
          # use pinned here, hash recorded so any upstream change fails loud.
          COSIGN_SHA256="4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71"
          curl -sL --max-time 120 -o /tmp/cosign https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-amd64
          echo "${COSIGN_SHA256}  /tmp/cosign" | sha256sum -c -
          sudo install -m 0755 /tmp/cosign /usr/local/bin/cosign
          cosign version
          skopeo --version

      # Tags are convenience pointers; verification is always digest-based
      # (ADR-008). edge + short-SHA on every dev push; :DISTRO_VERSION and
      # stable move only in the release flow, never here.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A5 (W5): the digest comes from the push itself via --digestfile,
      # never re-read from the mutable :edge tag (a concurrent push could
      # otherwise make us sign the wrong digest). SHA tag first, then edge
      # as a copy of the exact digest just pushed.
      - name: Push SHA + edge tags (digest from push)
        id: push
        run: |
          SHA_TAG="${GITHUB_SHA::8}"
          skopeo copy --digestfile digest.txt \
            "oci-archive:${{ steps.artifact.outputs.tarball }}" \
            "docker://${{ env.IMAGE }}:${SHA_TAG}"
          DIGEST="$(cat digest.txt)"
          test -n "${DIGEST}" || { echo "Empty digest from push"; exit 1; }
          skopeo copy \
            "docker://${{ env.IMAGE }}@${DIGEST}" \
            "docker://${{ env.IMAGE }}:edge"
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"
          echo "Pushed digest: ${DIGEST}"
          echo "- Image digest: \`${DIGEST}\`" >> "${GITHUB_STEP_SUMMARY}"

      # Slice 4: keyless supply-chain evidence, push events only. Signing
      # throwaway PR images would spam Rekor (transparency log entries are
      # forever, PR builds are not) - and there is nothing to attest on an
      # image that was never pushed. Digest (never tag) throughout: tags
      # move, digests don't (ADR-008).
      - name: Sign image digest (keyless OIDC)
        run: |
          cosign sign --yes "${{ env.IMAGE }}@${{ steps.push.outputs.digest }}"

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest SBOM
        uses: actions/attest-sbom@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: ${{ steps.artifact.outputs.sbom }}
          push-to-registry: true

      # A7 (W6): verify what was just signed. A bad or missing signature
      # fails this pipeline - no silent unsigned images. Both checks must
      # be blocking (no continue-on-error here, ever).
      - name: Verify signature + attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cosign verify "${{ env.IMAGE }}@${{ steps.push.outputs.digest }}" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\\.github/workflows/container-build\\.yml@refs/heads/dev$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          gh attestation verify "oci://${{ env.IMAGE }}@${{ steps.push.outputs.digest }}" \
            --repo "${GITHUB_REPOSITORY}"

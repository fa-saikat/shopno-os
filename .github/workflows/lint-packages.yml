name: Lint

# architecture.md §13: runs on every push, every PR. paths-ignore skips runs
# that can't possibly trip a lint check (docs-only changes)
on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'CHANGELOG.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'CHANGELOG.md'

# A push to a branch with an open PR fires both `push` and `pull_request: synchronize`
# for the same commit which this collapses the duplicate run instead of paying for both.
concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint suites
    # Same fork rule as the build workflows: untrusted code runs
    # nowhere on our runners or minutes, even when it's "just lint".
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Duplicate packages (per layer instance)
        run: bash tests/lint/check-duplicate-packages.sh

      - name: Hardcoded distro names / URLs
        run: bash tests/lint/check-no-hardcoded-names.sh

      - name: Brand variable usage completeness
        run: bash tests/lint/check-brand-vars-used.sh

      # scripts/dev/lint-packages.sh - the build-pipeline lint step
      # (naming convention, empty lists, package-name format, intra-list
      # duplicates, edition/flavor duplicates, layer-policy violations).
      # Same script build.sh calls before every build; running it here
      # too catches the same class of error without needing a full build.
      - name: Package list lint (build-pipeline script)
        run: bash scripts/dev/lint-packages.sh

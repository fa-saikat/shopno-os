# Overrides /usr/lib/tmpfiles.d/systemd-resolve.conf (same name).
# The package rule ("L!") never replaces an existing file, and live-build
# leaves /etc/resolv.conf as a plain file in the image. "L+" makes it the
# resolved stub at every boot, so NetworkManager hands the network's DNS
# servers to systemd-resolved, which fails over between them.
L+ /etc/resolv.conf - - - - ../run/systemd/resolve/stub-resolv.conf
